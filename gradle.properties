org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8 -Dcom.sun.security.enableCRLDP=false -Dcom.sun.net.ssl.checkRevocation=false -Djsse.enableOCSP=false
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
# 关闭 AAPT2 daemon 模式（proot 环境 daemon 启动失败），改单次执行（AGP 8.x 支持）
android.enableAapt2DaemonMode=false
# 指定 SDK 自带 aapt2（与 AGP 兼容性更好）
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/36.0.0/aapt2